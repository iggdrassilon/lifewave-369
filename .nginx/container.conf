# Container copy of .nginx/nginx.conf — same rules, minus what belongs to the
# host. TLS and the port-80 redirect stay on the host vhost (certbot manages
# the certificate there); this block only serves files.
#
# Deviations from .nginx/nginx.conf, all deliberate:
#   - listens on 80 inside the container, published to 127.0.0.1 on the host;
#   - no ssl_* / listen 443: the host terminates TLS;
#   - the @proxy fallback to localhost:8080 is gone — `yarn build` copies the
#     whole public/ tree (images, pdf, video, audio, fonts, content) into dist,
#     so a miss here means the file really is absent.
server {
  listen 80;
  server_name patch-stem-cells.ru www.patch-stem-cells.ru;

  access_log /var/log/nginx/cell_access.log;
  error_log /var/log/nginx/cell_error.log;

  root /var/www/cell;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html =404;
    include /etc/nginx/blocked_ips.conf;
  }

  location ~* "\.(svg|jpg|jpeg|png|gif|ico|css|js|pdf|mp4|woff|woff2|ttf|otf)$" {
    try_files $uri =404;
    add_header Cache-Control "max-age=60";
  }

  location ~* "/(assets|content|fonts|icons|images|pdf|video|)/$" {
    internal;
  }

  # content/*.json carries the editable copy — reviews, UI strings, texts.
  # Caching it would freeze the client's edits, hence the explicit no-store.
  location ~* \.json$ {
    etag off;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }
}
